<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - SauzCore Games</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <header>
    <img src="img/logo.PNG" alt="Logo SauzCore Games" class="logo">
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="servicios.html">Servicios</a></li>
      <li><a href="proyectos.html">Proyectos</a></li>
      <li><a href="SobreNosotros.html">Sobre nosotros</a></li>
      <li><a href="contacto.html" class="active">Contacto</a></li>
    </ul>
  </nav>

  <main>
    <section class="contact">
      <h2>Contáctanos</h2>
      <p>¿Tienes una idea o quieres colaborar con nosotros? Envíanos un mensaje y nos pondremos en contacto contigo.</p>

      <form action="#" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" required>

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

        <button type="submit">Enviar mensaje</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 SauzCore Games</p>
  </footer>

</body>
</html>
